<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/universal.css">
    <link rel="stylesheet" href="../static/index.css">
    <title>Document</title>
</head>
<body>
    {% if current_user.subscribed %}
        <div class="navbar">
            <a href="{{url_for('index')}}">Home</a>
            <a href="{{url_for('emails')}}">Emails</a>
            <a href="{{url_for('all_unsubs')}}">Mailing Lists</a>
            <a href="{{url_for('summary')}}">Summary</a>
            <a href="{{url_for('email_cleaner')}}">Inbox Cleaner</a>
            <a href="{{url_for('manage_subscription')}}">Manage Subscription</a>
        </div>
    {% else %}
        <div class="navbar">
            <a href="{{url_for('index')}}">Home</a>
            <a href="{{url_for('subscribe')}}">Subscribe</a>
            <a href="{{url_for('login')}}">Log In</a>
        </div>
    {% endif %}
    <div class="wrapper">
        <div class="hero">
            <div class="herocontainer">
                <h1 class="smarter">The Smarter Way to Email</h1>
                <h1 class="turn">Turn you inbox into a <span class="todo">to-do list</span>, powered by custom AI</h1>
                <h3 class="try"><a class="trylink" href="{{url_for('subscribe')}}">Try it free →</a></h3>
            </div>
            <img src="../static/imgs/landscape-placeholder-svgrepo-com.svg" class="heroimg" alt="">
        </div>
        <div class="cards">
            <div class="card">

            </div>
        </div>
    </div>

</body>
</html>
