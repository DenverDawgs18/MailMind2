    <div class="main-content">
        <div class="unsubs">
            <div class="unsubheader">
                <h2 class="header">Sender</h1>
                <h2 class="header">Link</h1>
            </div>
            <div class="unsubmsg msgenabled">Found: {{number}} mailing lists</div>
            {% for unsub in unsubs %}
                <div class="unsubwrapper">
                    <p class="sender">{{unsub.sender}}</p>
                    <a href="{{unsub.link}}" target="_blank"><button data-sender="{{unsub.sender}}" data-manual="false" class="unsub">Unsubscribe</button></a>
                </div>
            {% endfor %}
        </div>
    </div>
