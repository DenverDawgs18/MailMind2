<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='universal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='code.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imgs/MailMindTempLogo.ico') }}">
</head>
<body>
    <div class="navbar">
        <a href="{{ url_for('index') }}" class="home">MailMind</a>
        <div class="navwrap">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('settings') }}">Settings</a>
                <a href="{{ url_for('logout') }}">Log out</a>
            {% else %}
                <a href="{{ url_for('contact') }}">Contact</a>
            {% endif %}
        </div>
        <div class="empty"></div>
    </div>
    <div class="main-content">
        <div class="container">
            {% if message %}
                <h1 class="message">{{message}}</h1>
            {% endif %}
            <form action="/code" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <h1>Enter code below</h1>
                <input type="text" name="code">
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
    <footer>
        <a href="{{url_for('terms_and_privacy')}}">Terms of Use and Privacy Policy</a>
    </footer>
</body>
</html>
