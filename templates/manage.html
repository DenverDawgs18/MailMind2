<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/universal.css">
    <link rel="stylesheet" href="../static/manage.css">
    <title>Document</title>
</head>
<body>
    {% if current_user.subscribed %}
        <div class="navbar">
            <a href="{{url_for('index')}}">Home</a>
            <a href="{{url_for('emails')}}">Inbox</a>
            <a href="{{url_for('summary')}}">To-Do List</a>
            <a href="{{url_for('all_unsubs')}}">Mailing Lists</a>
            <a href="{{url_for('email_cleaner')}}">Inbox Cleaner</a>
            <a href="{{url_for('manage_subscription')}}">Manage Subscription</a>
        </div>
    {% else %}
        <div class="navbar">
            <a href="{{url_for('index')}}">Home</a>
            <a href="{{url_for('subscribe')}}">Subscribe</a>
            <a href="{{url_for('login')}}">Log In</a>
        </div>
    {% endif %}
    <div class="main-content">
        <div class="container">
            <h2 class="manageheader">The link below will take you to our payment partner's page to manage your subscription.</h2>
            <h1 class="manage"><a class="managelink" target="_blank" href="https://billing.stripe.com/p/login/test_6oUaEXaa2f44d4n4cr93y00">Manage Subscription</a></h1>
        </div>
    </div>
    <footer>
        <a href="{{url_for('terms_and_privacy')}}">Terms of Use and Privacy Policy</a>
    </footer>
</body>
</html>
