<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='universal.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='imgs/MailMindTempLogo.ico') }}">
    <style>
        .main-content { max-width: 640px; margin: 40px auto; padding: 0 20px; }
        .container { background: rgba(58, 53, 96, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 32px; }
        .form-header h1 { color: #e6d7a3; margin-top: 0; }
        .form-header p { color: #aaa; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin: 16px 0; }
        .form-group label { color: #f0f0f0; font-weight: 500; }
        .form-group input, .form-group textarea {
            padding: 10px; border-radius: 6px; background: #2b2540; color: #f0f0f0;
            border: 1px solid #4a4370; font-family: inherit; font-size: 14px;
        }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .submit-btn { padding: 10px 20px; background: #cc8400; color: #171524; border: none;
            border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; }
    </style>
    <title>Contact — MailMind</title>
</head>
<body>
    <div class="navbar">
        <a href="{{ url_for('index') }}" class="home">MailMind</a>
        <div class="navwrap">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('settings') }}">Settings</a>
                <a href="{{ url_for('logout') }}">Log out</a>
            {% else %}
                <a href="{{ url_for('contact') }}">Contact</a>
                <a href="{{ url_for('terms_and_privacy') }}">Terms &amp; Privacy</a>
            {% endif %}
        </div>
        <div class="empty"></div>
    </div>
    <div class="main-content">
        <div class="container">
            <div class="form-header">
                <h1>Contact the Developer</h1>
                <p>Any concerns? Found a bug? Please let us know below! Thank you!</p>
            </div>
            
            <form class="request-form" action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="e56caf5c-afef-4ff8-86e5-e1ffbe1a9f21">
                <input type="hidden" name="redirect" value="https://mywebsite.com/thanks">
                
                <!--
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" placeholder="Enter your full name" required>
                </div>
            -->
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Enter your email address" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Found something wrong?" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Submit Form</button>
            </form>
        </div>
    </div>
    
    <footer>
        <a href="{{url_for('terms_and_privacy')}}">Terms of Use and Privacy Policy</a>
    </footer>

</body>
</html>
