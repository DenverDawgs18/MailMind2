<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/universal.css">
    <link rel="stylesheet" href="../static/subscribe.css">
    <title>Document</title>
</head>
<body>
    {% if current_user.subscribed %}
        <div class="navbar">
            <a href="{{url_for('index')}}">Home</a>
            <a href="{{url_for('emails')}}">Emails</a>
            <a href="{{url_for('all_unsubs')}}">Mailing Lists</a>
            <a href="{{url_for('summary')}}">Summary</a>
            <a href="{{url_for('email_cleaner')}}">Inbox Cleaner</a>
            <a href="{{url_for('manage_subscription')}}">Manage Subscription</a>
        </div>
    {% else %}
        <div class="navbar">
            <a href="{{url_for('index')}}">Home</a>
            <a href="{{url_for('subscribe')}}">Subscribe</a>
            <a href="{{url_for('login')}}">Log In</a>
        </div>
    {% endif %}
    <div class="container">
        <div class="product">
            <div class="description">
                <h1 class="click">Click the checkout button below to be taken to our payment partner's page to subscribe</h1>
                <h3 class="one">One Month of MailMind</h3>
                <h3 class="price">$25.00 / month</h3>
            </div>
        </div>
        <form action="/create-checkout-session" method="POST">
            <!-- Add a hidden field with the lookup_key of your Price -->
            <input type="hidden" name="lookup_key" value="One_Month_of_MailMind-ae39e51" />
            <button class="checkout" id="checkout-and-portal-button" type="submit">Checkout</button>
        </form>
    </div>
</body> 
</html>
