<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='universal.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='imgs/logo.svg') }}">
    <link rel="alternate icon" href="{{ url_for('static', filename='imgs/MailMindTempLogo.ico') }}">
    <title>Subscribe — MailMind</title>
    <style>
        .subscribe-wrapper { max-width: 520px; margin: 60px auto; padding: 0 20px; }
        .card { background: #fff; border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 32px; text-align: center; }
        .card h1 { margin-top: 0; font-size: 40px; letter-spacing: -0.04em; }
        .price { font-size: 2.4rem; font-weight: 700; letter-spacing: -0.03em; margin: 16px 0 4px; }
        .tos { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 24px 0; color: var(--gray); font-size: 14px; }
        button.checkout { padding: 14px 28px; background: var(--ink); color: #fff; border: none; border-radius: 999px; font-family: inherit; font-weight: 600; font-size: 16px; cursor: pointer; }
        button.checkout:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="{{ url_for('index') }}" class="home">MailMind</a>
        <div class="navwrap">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('settings') }}">Settings</a>
                <a href="{{ url_for('logout') }}">Log out</a>
            {% else %}
                <a href="{{ url_for('contact') }}">Contact</a>
            {% endif %}
        </div>
        <div class="empty"></div>
    </div>

    <div class="subscribe-wrapper">
        <div class="card">
            <h1>Subscribe to MailMind</h1>
            <p class="price">$25 / month</p>
            <p>7-day free trial, cancel any time.</p>

            <form action="{{ url_for('create_checkout_session') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                <input type="hidden" name="lookup_key" value="One_Month_of_MailMind-ae39e51" />

                <label class="tos">
                    <input type="checkbox" id="accept-tos" />
                    I accept the
                    <a href="{{ url_for('terms_and_privacy') }}" target="_blank" style="color:var(--accent-ink);">Terms of Service and Privacy Policy</a>.
                </label>

                <button class="checkout" type="submit" disabled>Continue to checkout</button>
            </form>
        </div>
    </div>

    <footer>
        <a href="{{ url_for('terms_and_privacy') }}">Terms of Use and Privacy Policy</a>
    </footer>

    <script>
        document.getElementById('accept-tos').addEventListener('change', function() {
            document.querySelector('button.checkout').disabled = !this.checked;
        });
    </script>
</body>
</html>
