<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" href="../static/universal.css">
        <link rel="stylesheet" href="../static/login.css">
        <link rel="icon" type="image/x-icon" href="../static/imgs/MailMindTempLogo.ico">
    </head>
    <body>
        {% if current_user.subscribed %}
            <div class="navbar">
                <a href="{{url_for('index')}}" class="home">Home</a>
                <div class="navwrap">
                    <a href="{{url_for('emails')}}">Inbox</a>
                    <a href="{{url_for('summary')}}">To-Do List</a>
                    <a href="{{url_for('set_time')}}">Set Time</a>
                    <a href="{{url_for('portal')}}">Portal</a>
                    <a href="{{url_for('contact')}}">Contact</a>
                </div>
                <div class="empty">
                </div>
            </div>
        {% else %}
            <div class="navbar">
                <a href="{{url_for('index')}}">Home</a>
                <div class="navwrap">
                    <a href="{{url_for('request_access')}}">Request Access</a>
                    <a href="{{url_for('login')}}">Log In</a>
                </div>
            </div>
        {% endif %}
        <div class="main-content">
            <div class="container">
            <form id="auth-form">
                <h1 id="form-title">Login</h1>
                <input type="hidden" id="mode" value="login">

                <input type="text" id="username" placeholder="Username" required>
                <small id="username-feedback"></small>

                <input type="password" id="password" placeholder="Password" required>

                <button type="submit" id="submit-btn">Login</button>

                <p class="toggle-text">
                    Don't have an account?
                    <a href="#" id="toggle-link" onclick="toggleMode(event)">Register here</a>
                </p>

                <div id="message-box"></div>
            </form>
            </div>
        </div>

        <footer>
            <a href="{{url_for('terms_and_privacy')}}">Terms of Use and Privacy Policy</a>
        </footer>

        <script src="../static/login.js"></script>
    </body>
</html>
