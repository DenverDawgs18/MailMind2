# fly.toml app configuration file for mailmind
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "mailmind"
primary_region = "ord"

[build]

[deploy]
  # fly.toml's [processes] override the Dockerfile CMD, so migrations have to
  # run here or they never run in production.
  release_command = "flask db upgrade"

[env]
  PORT = "8080"
  FLASK_ENV = "production"
  MAILMIND_PRODUCTION = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    grace_period = "5s"
    method = "GET"
    path = "/"
    protocol = "http"
    timeout = "2s"

[processes]
  # --timeout covers /cron/tick, which streams while it works.
  app = "gunicorn --bind 0.0.0.0:8080 --workers 2 --threads 4 --worker-class gthread --timeout 900 --keep-alive 65 app:app"
  # No always-on scheduler: .github/workflows/tick.yml calls POST /cron/tick
  # every 15 minutes, which wakes the app (scheduler_run.py is for local dev).

[http_service.concurrency]
  type = "connections"
  hard_limit = 25
  soft_limit = 20

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
